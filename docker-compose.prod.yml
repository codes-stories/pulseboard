# Production Docker Compose
# Run with: docker compose -f docker-compose.prod.yml up -d

version: '3.8'

services:
  # ──────────────────────────────────────────────────────────────────────────
  # Backing Services
  # ──────────────────────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: pulseboard-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulseboard}
      POSTGRES_USER: ${POSTGRES_USER:-pulseboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulseboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - pulseboard-network

  redis:
    image: redis:7-alpine
    container_name: pulseboard-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - pulseboard-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: pulseboard-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - pulseboard-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: pulseboard-kafka
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/etc/confluent/docker/healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - pulseboard-network

  # ──────────────────────────────────────────────────────────────────────────
  # Application Services
  # ──────────────────────────────────────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulseboard-backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pulseboard}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pulseboard}?sslmode=disable
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      KAFKA_ENABLED: "true"
      KAFKA_TOPIC: "api-logs"
      JWT_SECRET: ${JWT_SECRET}
      SERVER_PORT: "8080"
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - pulseboard-network

  pulse-agent:
    build:
      context: ./pulse_agent_v1
      dockerfile: Dockerfile
    container_name: pulseboard-agent
    ports:
      - "8082:8082"
      - "8083:8083"
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_ENABLED: "true"
      KAFKA_TOPIC: "api-logs"
      KAFKA_CLIENT_ID: "pulse-agent-docker"
      KAFKA_ACKS: "all"
      KAFKA_BATCH_SIZE: "16384"
      KAFKA_LINGER_MS: "5"
      KAFKA_COMPRESSION: "snappy"
      OTEL_ENABLED: "true"
      OTEL_HTTP_PORT: "8083"
      POSTGRES_ENABLED: "false"
      BACKEND_API_URL: "http://backend:8080"
      BACKEND_SYNC_ENABLED: "false"
    volumes:
      - ./pulse_agent_v1/config.yaml:/opt/pulse-agent/config.yaml:ro
    depends_on:
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - pulseboard-network

  frontend:
    build:
      context: ./pluseboard-monitoring
      dockerfile: Dockerfile
    container_name: pulseboard-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_WS_URL: ws://localhost:8080
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - pulseboard-network

volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:

networks:
  pulseboard-network:
    driver: bridge